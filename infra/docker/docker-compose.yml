# ============================================================
# ŞantiyePro — Production Docker Compose profili
# docs/10-deployment-backup.md kurallarına göre:
# - Servisler ayrı network içinde; DB portu dışarı açılmaz
# - Kalıcı volume'lar açıkça tanımlı
# - Healthcheck + restart policy
# - Secrets .env ile verilir (örnek: .env.example)
# ============================================================

name: santiyepro

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santiyepro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB:-santiyepro}
      # Avrupa/Istanbul saat dilimi (docs/implementation-notes.md)
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    # GÜVENLİK: DB portu dışarı yayımlanmaz (docs/07). Yalnızca internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-santiyepro} -d ${POSTGRES_DB:-santiyepro}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  object-storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY .env içinde tanımlı olmalı}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY .env içinde tanımlı olmalı}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-santiyepro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-santiyepro}?schema=public
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS .env içinde tanımlı olmalı}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET .env içinde tanımlı olmalı}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET .env içinde tanımlı olmalı}
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-santiyepro-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # TLS sonlandırma ve reverse proxy — Caddy örnek yapılandırma.
  # Üretimde müşteri domain'i ve sertifika ayarları Caddyfile üzerinden yapılır.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy

networks:
  internal:
    internal: true
  proxy:

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
