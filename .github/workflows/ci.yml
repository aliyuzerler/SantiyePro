name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest

    # Faz 02'den itibaren auth e2e testleri gerçek PostgreSQL üzerinde koşar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: santiyepro
          POSTGRES_PASSWORD: santiyepro
          POSTGRES_DB: santiyepro_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U santiyepro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://santiyepro:santiyepro@localhost:5433/santiyepro_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef
      ADMIN_SETUP_TOKEN: ci-setup-token-0123456789abcdef
      COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migrate
        run: |
          pnpm --filter @santiyepro/api prisma:generate
          pnpm --filter @santiyepro/api prisma:deploy
          pnpm --filter @santiyepro/contracts build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (contracts önce, sonra uygulamalar)
        run: pnpm build

      - name: Test (API birim + e2e, contracts, web, mobil)
        run: |
          pnpm --filter @santiyepro/contracts test
          pnpm --filter @santiyepro/api test
          pnpm --filter @santiyepro/api test:e2e
          pnpm --filter @santiyepro/web test
          pnpm --filter @santiyepro/mobile test
