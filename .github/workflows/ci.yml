name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (contracts önce, sonra uygulamalar)
        run: pnpm build

      - name: Test (API birim + e2e, contracts, web, mobil)
        run: |
          pnpm --filter @santiyepro/contracts test
          pnpm --filter @santiyepro/api test
          pnpm --filter @santiyepro/api test:e2e
          pnpm --filter @santiyepro/web test
          pnpm --filter @santiyepro/mobile test

