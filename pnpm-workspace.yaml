packages:
  - "apps/*"
  - "packages/*"

# Postinstall script'e izin verilen bağımlılıklar (pnpm 12 güvenlik varsayılanı)
onlyBuiltDependencies:
  - "@embedded-postgres/linux-x64"
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"

# Faz 11 güvenlik sertleştirmesi: pnpm audit bulgularına karşı minimum sürüm
# override'ları (prisma transitive effect/deepmerge-ts ve exceljs uuid).
overrides:
  "effect": "^3.20.0"
  "deepmerge-ts": ">=8.0.0"
  "uuid": ">=11.1.1"
